[project]
name = "ahcof-backend"
version = "0.1.0"
description = "Backend API for the AHCoF member application prototype"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic[email]",
    "pytest",
    "httpx",
    "pwdlib[argon2]",
    "PyJWT",
    "python-multipart",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

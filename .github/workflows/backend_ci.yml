jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ahcof_user
          POSTGRES_PASSWORD: ahcof_local_dev_password
          POSTGRES_DB: ahcof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahcof_user -d ahcof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://ahcof_user:ahcof_local_dev_password@localhost:5432/ahcof
      JWT_SECRET_KEY: ci-test-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e .

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Seed demo data
        run: python -m app.scripts.seed_demo_data

      - name: Run tests
        run: python -m pytest -q
